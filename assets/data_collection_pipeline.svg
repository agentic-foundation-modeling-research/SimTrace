<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 390" role="img" aria-labelledby="title description">
  <title id="title">Data collection pipeline</title>
  <desc id="description">Website activity is collected by analytics providers, standardized by a processor into raw sessions, enriched with intent and persona, and written to sessions.jsonl. An anonymized external CSV is a secondary projection of the raw sessions.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#f87171"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .card { filter: url(#shadow); stroke-width: 1.5; }
      .step { font-size: 10px; font-weight: 700; letter-spacing: .08em; }
      .heading { font-size: 14px; font-weight: 700; }
      .detail { font-size: 10.5px; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .flow { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="390" fill="url(#page)"/>

  <text x="640" y="38" text-anchor="middle" font-size="23" font-weight="750" fill="#0f172a">Data Collection Pipeline</text>
  <text x="640" y="64" text-anchor="middle" font-size="12.5" fill="#64748b">Collect website activity, standardize it, and enrich each session for data generation</text>

  <!-- Primary flow arrows stay short and horizontal. -->
  <g class="flow">
    <path d="M188 176 H218"/>
    <path d="M396 176 H426"/>
    <path d="M624 176 H654"/>
    <path d="M832 176 H862"/>
    <path d="M1045 176 H1075"/>
  </g>

  <!-- 1. Website -->
  <g>
    <rect class="card" x="28" y="125" width="160" height="95" rx="14" fill="#eef2ff" stroke="#818cf8"/>
    <rect x="44" y="138" width="58" height="20" rx="10" fill="#e0e7ff"/>
    <text class="step" x="73" y="152" text-anchor="middle" fill="#4f46e5">01 · INPUT</text>
    <text class="heading" x="108" y="182" text-anchor="middle" fill="#312e81">Website</text>
    <text class="detail" x="108" y="201" text-anchor="middle" fill="#6366f1">tracking snippet</text>
  </g>

  <!-- 2. Providers -->
  <g>
    <rect class="card" x="226" y="96" width="170" height="160" rx="14" fill="#ecfeff" stroke="#22d3ee"/>
    <rect x="242" y="110" width="76" height="20" rx="10" fill="#cffafe"/>
    <text class="step" x="280" y="124" text-anchor="middle" fill="#0891b2">02 · COLLECT</text>
    <text class="heading" x="311" y="153" text-anchor="middle" fill="#164e63">Analytics Providers</text>
    <rect x="242" y="169" width="138" height="29" rx="7" fill="#ffffff" stroke="#a5f3fc"/>
    <circle cx="257" cy="183.5" r="4" fill="#06b6d4"/>
    <text class="detail" x="269" y="187" fill="#155e75">Microsoft Clarity</text>
    <rect x="242" y="207" width="138" height="29" rx="7" fill="#ffffff" stroke="#a5f3fc"/>
    <circle cx="257" cy="221.5" r="4" fill="#06b6d4"/>
    <text class="detail" x="269" y="225" fill="#155e75">PostHog</text>
  </g>

  <!-- 3. Processor -->
  <g>
    <rect class="card" x="434" y="96" width="190" height="160" rx="14" fill="#f0fdf4" stroke="#4ade80"/>
    <rect x="450" y="110" width="84" height="20" rx="10" fill="#dcfce7"/>
    <text class="step" x="492" y="124" text-anchor="middle" fill="#16a34a">03 · PROCESS</text>
    <text class="heading" x="529" y="153" text-anchor="middle" fill="#14532d">Processor</text>
    <text class="detail" x="529" y="171" text-anchor="middle" fill="#16a34a">standardize + anonymize</text>
    <rect x="450" y="187" width="158" height="25" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
    <text class="detail code" x="529" y="203" text-anchor="middle" fill="#166534">ClarityProcessor</text>
    <rect x="450" y="220" width="158" height="25" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
    <text class="detail code" x="529" y="236" text-anchor="middle" fill="#166534">PosthogProcessor</text>
  </g>

  <!-- 4. Standardized raw sessions -->
  <g>
    <rect class="card" x="662" y="110" width="170" height="132" rx="14" fill="#fffbeb" stroke="#fbbf24"/>
    <rect x="678" y="124" width="78" height="20" rx="10" fill="#fef3c7"/>
    <text class="step" x="717" y="138" text-anchor="middle" fill="#d97706">04 · OUTPUT</text>
    <path d="M723 160h42l10 10v35h-52z" fill="#ffffff" stroke="#fbbf24" stroke-width="1.2"/>
    <path d="M765 160v10h10" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
    <path d="M733 179h32M733 187h32M733 195h22" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
    <text class="heading code" x="747" y="220" text-anchor="middle" fill="#92400e">sessions_raw.csv</text>
  </g>

  <!-- 5. Enrichment -->
  <g>
    <rect class="card" x="870" y="110" width="175" height="132" rx="14" fill="#faf5ff" stroke="#c084fc"/>
    <rect x="886" y="124" width="76" height="20" rx="10" fill="#f3e8ff"/>
    <text class="step" x="924" y="138" text-anchor="middle" fill="#9333ea">05 · ENRICH</text>
    <circle cx="957.5" cy="169" r="18" fill="#ffffff" stroke="#e9d5ff"/>
    <path d="M957.5 157v24M945.5 169h24M949 160.5l17 17M966 160.5l-17 17" stroke="#a855f7" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="957.5" cy="169" r="4" fill="#a855f7"/>
    <text class="heading" x="957.5" y="203" text-anchor="middle" fill="#6b21a8">Enrich Sessions</text>
    <text class="detail code" x="957.5" y="221" text-anchor="middle" fill="#9333ea">enrich_sessions.py</text>
    <text class="detail" x="957.5" y="236" text-anchor="middle" fill="#a855f7">intent + persona</text>
  </g>

  <!-- 6. Enriched dataset -->
  <g>
    <rect class="card" x="1083" y="110" width="169" height="132" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
    <rect x="1099" y="124" width="76" height="20" rx="10" fill="#dbeafe"/>
    <text class="step" x="1137" y="138" text-anchor="middle" fill="#2563eb">06 · READY</text>
    <circle cx="1167.5" cy="171" r="20" fill="#ffffff" stroke="#bfdbfe"/>
    <path d="M1157 171l7 7 14-15" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="heading code" x="1167.5" y="207" text-anchor="middle" fill="#1e40af">sessions.jsonl</text>
    <text class="detail" x="1167.5" y="226" text-anchor="middle" fill="#3b82f6">generation-ready</text>
  </g>

  <!-- Secondary anonymized projection; visually separate from the primary path. -->
  <path d="M747 242 V270" fill="none" stroke="#f87171" stroke-width="1.6" stroke-dasharray="4 5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <g>
    <rect x="642" y="278" width="210" height="68" rx="12" fill="#fff7f7" stroke="#fca5a5" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text class="heading code" x="747" y="305" text-anchor="middle" fill="#991b1b">sessions_external.csv</text>
    <text class="detail" x="747" y="325" text-anchor="middle" fill="#dc2626">anonymized projection</text>
    <text x="747" y="339" text-anchor="middle" font-size="9.5" fill="#f87171">safe for external use</text>
  </g>
</svg>
